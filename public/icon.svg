<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)" />

  <!-- Subtle inner ambient shine -->
  <rect width="512" height="512" rx="112" fill="url(#accentGradient)" />

  <!-- Inner circular badge -->
  <circle cx="256" cy="256" r="168" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4" />

  <!-- Filipino Peso Symbol ₱ -->
  <g filter="url(#dropShadow)" transform="translate(256, 256)">
    <!-- Base text with thick clean typography -->
    <text
      x="0"
      y="54"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      font-size="240"
      font-weight="900"
      text-anchor="middle"
      fill="#ffffff"
    >₱</text>
  </g>

  <!-- Little sparkle indicator at top right -->
  <circle cx="360" cy="150" r="14" fill="#fbbf24" filter="url(#dropShadow)" />
  <circle cx="380" cy="175" r="8" fill="#fef08a" />
</svg>
